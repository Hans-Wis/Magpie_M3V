adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824
transport select jtag
adapter speed 1000
reset_config trst_and_srst separate

set _CHIPNAME magpie_m1
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10a98ad3
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu -dbgbase 0
riscv set_ir idcode 0x01
riscv set_ir dtmcs 0x10
riscv set_ir dmi 0x11
riscv set_command_timeout_sec 10
riscv set_reset_timeout_sec 10
