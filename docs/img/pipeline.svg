<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1060 340" width="100%" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}</style>
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#8B8168"/>
      </marker>
    </defs>

    <!-- FETCH -->
    <rect x="30" y="79" width="210" height="110" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.6"/>
    <text x="135" y="109" fill="#1F8A7D" font-size="16" text-anchor="middle" font-weight="700">FETCH</text>
    <text x="135" y="133" fill="#5B5342" font-size="13" text-anchor="middle">ITCM 讀取</text>
    <text x="135" y="153" fill="#5B5342" font-size="13" text-anchor="middle">分支預測 / PC 更新</text>

    <line x1="240" y1="134" x2="288" y2="134" stroke="#8B8168" stroke-width="1.6" marker-end="url(#arrow2)"/>

    <!-- DECODE/DISPATCH -->
    <rect x="288" y="79" width="232" height="110" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.6"/>
    <text x="404" y="109" fill="#3A5BA8" font-size="16" text-anchor="middle" font-weight="700">DECODE / ISSUE</text>
    <text x="404" y="133" fill="#5B5342" font-size="13" text-anchor="middle">hazard 偵測 + forwarding</text>
    <text x="404" y="153" fill="#5B5342" font-size="13" text-anchor="middle">single-issue · in-order</text>

    <line x1="520" y1="134" x2="568" y2="134" stroke="#8B8168" stroke-width="1.6" marker-end="url(#arrow2)"/>

    <!-- EXECUTE stack -->
    <rect x="568" y="20" width="232" height="68" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.6"/>
    <text x="684" y="48" fill="#1F8A7D" font-size="15" text-anchor="middle" font-weight="700">EXECUTE · 純量</text>
    <text x="684" y="70" fill="#5B5342" font-size="12.5" text-anchor="middle">ALU / Mul-Div / BRU / FPU</text>

    <rect x="568" y="100" width="232" height="68" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.6"/>
    <text x="684" y="128" fill="#3A5BA8" font-size="15" text-anchor="middle" font-weight="700">EXECUTE · 向量</text>
    <text x="684" y="150" fill="#5B5342" font-size="12.5" text-anchor="middle">SIMD ALU / MAC 陣列</text>

    <rect x="568" y="180" width="232" height="68" rx="8" fill="#E7F3E9" stroke="#3E8F49" stroke-width="1.6"/>
    <text x="684" y="208" fill="#2C6B34" font-size="15" text-anchor="middle" font-weight="700">EXECUTE · 訪存</text>
    <text x="684" y="230" fill="#5B5342" font-size="12.5" text-anchor="middle">LSU → DTCM / EBUS</text>

    <!-- converging arrows to RETIRE (length ~55-90, clearly visible) -->
    <line x1="800" y1="54" x2="850" y2="112" stroke="#8B8168" stroke-width="1.6" marker-end="url(#arrow2)"/>
    <line x1="800" y1="134" x2="850" y2="139" stroke="#8B8168" stroke-width="1.6" marker-end="url(#arrow2)"/>
    <line x1="800" y1="214" x2="850" y2="168" stroke="#8B8168" stroke-width="1.6" marker-end="url(#arrow2)"/>

    <!-- RETIRE -->
    <rect x="850" y="84" width="190" height="110" rx="8" fill="#F7EFDD" stroke="#B9791E" stroke-width="1.6"/>
    <text x="945" y="118" fill="#B9791E" font-size="16" text-anchor="middle" font-weight="700">WRITEBACK</text>
    <text x="945" y="142" fill="#5B5342" font-size="13" text-anchor="middle">依序寫回暫存器</text>
    <text x="945" y="163" fill="#5B5342" font-size="13" text-anchor="middle">依序 commit</text>
    <text x="945" y="181" fill="#5B5342" font-size="13" text-anchor="middle">例外 / 中斷檢查</text>

    <text x="530" y="288" fill="#8B8168" font-size="13.75" text-anchor="middle">Hazard：RAW 由 forwarding 解 · load-use / 多週期單元以 stall</text>
    <text x="530" y="308" fill="#8B8168" font-size="13.75" text-anchor="middle">單發依序：同一時間一條指令進 EXECUTE（三為功能單元,非並行分派）</text>
  </svg>
