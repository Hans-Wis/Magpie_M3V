      "notes": "ADR-0065 F1.5 S0: activation LUT run on the sequencer core (scalar lbu), NOT the host. W0.RPT = element count (<=255). Nonlinear-in-RTL green-wash guard: gelu = MAT_ACT_LUT[gate]."
    },
    {
      "name": "MAT_EWISE_MUL",
      "value": 9,
      "w1": "multiplier_q31",
      "w2": "(src_a_tcm_byte<<16)|src_b_tcm_byte",
      "w3": "(dst_tcm_byte<<16)|(shift&0xFF)",
      "fields": [
        "src_a",
        "src_b",
        "dst",
        "multiplier_q31",
        "shift",
        "len"
      ],
      "notes": "ADR-0065 F1.5 S0: elementwise int8*int8 -> per-tensor gemmlowp requant -> int8, on the sequencer core. dst[i] = clamp(rdbpot(srdhm(a[i]*b[i], mult_q31), shift-31), -128, 127); out_zp=0. srdhm/rdbpot MUST match mat_golden/mat_engine (trunc-toward-zero). W0.RPT = element count."
    },
    {
      "name": "MAT_RMSNORM",
      "value": 10,
      "w1": "src_tcm_byte",
      "w2": "dst_tcm_byte",
      "w3": "param_tcm_byte (32B header: SA2_Q,OUT_NUM,EPS_Q,c0,c1,c2,c3,INV_SQRT2_Q16; then H int16 (1+w) Q2.14 weights)",
      "fields": [
        "src",
        "dst",
        "param",
        "len"
      ],
      "notes": "ADR-0062 F1.6 S1: Gemma RMSNorm one row per descriptor on the sequencer core. sum_sq=Sum(src^2); mean_sq=sum_sq//H; arg_q=mean_sq*SA2_Q+EPS_Q; (y_adj,sh)=rsqrt_q31(arg_q) via degree-3 mantissa poly (coeffs from the golden param blob, zero firmware constants -> non-circular SSOT); out_i=sat8( ((src_i*y_adj*w_q16_i)>>14 * OUT_NUM + rbias) >> (47+sh) ). W0.RPT=H (<=255). Nonlinear-in-RTL: no scalar-F, pure int fixed-point."
    },
    {
      "name": "MAT_EWISE_ADD_REQUANT",
      "value": 11,
      "w1": "(src_a_tcm_byte<<16)|src_b_tcm_byte",
      "w2": "dst_tcm_byte",
      "w3": "param_tcm_byte (12B: R_NUM,X_NUM,SHIFT)",
      "fields": [
        "src_a",
        "src_b",
        "dst",
        "param",
        "len"
      ],
      "notes": "ADR-0062 F1.6 S1: residual add on the sequencer core. dst[i]=sat8( (a[i]*R_NUM + b[i]*X_NUM + (1<<(SHIFT-1))) >> SHIFT ); independent input scales folded to R_NUM/X_NUM (Q16), out_zp=0. Mirror of MAT_EWISE_MUL. W0.RPT = element count."
    },
    {
      "name": "MAT_ROPE",
      "value": 12,
      "w1": "(src_tcm_byte<<16)|dst_tcm_byte",
      "w2": "table_tcm_byte (hd int16 cos Q15, then hd int16 sin Q15, for this sequence position)",
      "w3": "param_tcm_byte (8B: mult_q31, rdbpot_shift+31)",
      "fields": [
        "src",
        "dst",
        "table",
        "param",
        "len"
      ],
      "notes": "ADR-0062 F1.6 S2: neox RoPE on one head-vector (head_dim=W0.RPT). half=hd/2; rot_i = -src[i+half] (i<half) else src[i-half]; acc = src_i*cos_q15_i + rot_i*sin_q15_i (int32 Q15); dst[i] = clamp(rdbpot(srdhm(acc, mult), shift-31), -128, 127). Requant multiplier per-tensor; only the cos/sin table pointer varies with sequence position. Nonlinear-in-RTL, pure int."
    },
    {
      "name": "MAT_SOFTMAX",
      "value": 13,
      "w1": "(src_tcm_byte<<16)|dst_tcm_byte",
      "w2": "exp_lut_tcm_byte (256-entry uint16 EXP_LUT)",
      "w3": "(valid<<16)|prob_scale",
      "fields": [
        "src",
        "dst",
        "lut",
        "valid",
        "prob_scale",
        "len"
      ],
      "notes": "ADR-0062 F1.6 S3: one attention row softmax on the sequencer core. W0.RPT=n key positions; valid = causal attend count (<=n). mx = max_{j<valid} src[j]; e[j] = EXP_LUT[mx-src[j]]; sm = sum e[j]; dst[j<valid] = (e[j]*prob_scale + sm/2)/sm; dst[j>=valid] = 0. EXP_LUT[d]=round(exp(-d*s_score)*65535). Nonlinear-in-RTL, pure int (uint32 divide)."
    },
    {
      "name": "MAT_REQUANT_VEC",
      "value": 14,
      "w1": "mult_q31",
      "w2": "(rsp<<16)|clamp where rsp=(out_zp<<8)|shift and clamp=(clamp_max<<8)|clamp_min",
      "w3": "(src_tcm_byte<<16)|dst_tcm_byte",
      "fields": [
        "acc",
        "mult_q31",
        "rsp",
        "clamp",
        "src",
        "dst",
        "len"
      ],
      "notes": "ADR-0066 E1a: CQ-driven LOADVEC->RESCALE path for an arbitrary padded-64 int32 vector. W0.ACC selects the accumulator bank; W0.RPT=len (<=64) is the consumed element count, while RTL LOADVEC/RESCALE always processes 64 lanes. src is 32B-aligned 64x int32 in TCM; dst reserves 64 int8 bytes."
    },
    {
      "name": "MAT_STRIP_GEMM",
      "value": 15,
      "w1": "W_BASE(shared/DDR byte address, 4KB aligned)",
      "w2": "(N_STRIPS[11:0]<<17) | STRIP_BYTES[16:0]",
      "w3": "(K_CHUNKS[7:0]<<24) | (K_TAIL[6:0]<<17) | (N_TAIL[6:0]<<10) | out_dst64[9:0]",
      "fields": [
        "w_base",
        "strip_bytes",
        "n_strips",
        "k_chunks",
        "k_tail",
        "n_tail",
        "out_dst64"
      ],
      "notes": "Strip-mode GEMM transport op (strip_rail_promotion_design.md §1/§6): frozen shared blob v2 at W_BASE is [header 64B] ++ [weights: N_STRIPS*STRIP_BYTES] ++ [param blocks: ceil((N_STRIPS*64)/8)*64B] ++ [fold blocks: ceil((N_STRIPS*64)/8)*32B] ++ [activation chunks: K_CHUNKS*512B, packed per chunk as [k][8]]. Header words are magic 'STR2', rsp, clamp, version=2, reserved. N_TAIL only trims final-strip compute; params/folds derive from N_STRIPS*64 and tail blocks are present/zero-padded by the emitter. The sequencer validates W_BASE 4KB alignment plus wrap-safe shared/output/TCM staging bounds, validates the header, internally stages params to 0x1200+i*64, folds to 0x1600+i*32, and activation to OP_A_ADDR+c*0x200, then writes ML_RSPCLAMP 0xB0 and ml_ctrl CSRs 0x94..0xAC, GO, and polls ML_STATUS.DONE. Output base is out_dst64*64, and sub-tile block address is base+(s*8+t)*64."
    }
