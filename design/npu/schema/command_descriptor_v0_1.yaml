      "notes": "ADR-0042: W0.RPT=1 selects PER-CHANNEL mode \u2014 W1 becomes a 32B-aligned TCM ptr to 8x Q31 mult words + 8 shift bytes (40B); zp/clamp stay per-tensor in W2/W3. RPT=0 = per-tensor (W1 = Q31 multiplier)."
