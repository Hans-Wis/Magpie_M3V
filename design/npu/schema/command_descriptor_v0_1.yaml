      "w2": "src_row_stride_bytes (0 = contiguous; ADR-0043 2D gather: rows x cols words, src row r at src_addr + r*stride)",
      "w3": "(rows<<8)|cols",
      "fields": [
        "src_addr",
        "stride",
        "rows",
        "cols"
      ],
      "notes": "P0.2 firmware requires stride=0 and loads rows*cols words into the fixed TCM weight region at byte 0x600 (ADR-0037: moved from 0x400 when the sequencer text outgrew it)."
    },
    {
      "name": "MAT_OP",
      "value": 3,
      "w1": "a_addr",
      "w2": "b_addr",
      "w3": "(acc_r<<4)|acc_c",
      "fields": [
        "a_addr",
        "b_addr",
        "acc_r",
        "acc_c"
      ],
      "notes": "ADR-0037: W3 must be 0 in v0.1 (tile coords reserved); RPT (W0) must equal K/8 from the latched MAT_CFG; a_addr/b_addr are 4-byte-aligned TCM byte addresses."
    },
    {
      "name": "MAT_RESCALE",
      "value": 4,
      "w1": "multiplier_q31",
      "w2": "(out_zp<<8)|shift",
      "w3": "(clamp_max<<8)|(clamp_min&0xFF)",
      "fields": [
        "multiplier_q31",
        "out_zp",
        "shift",
        "clamp_max",
        "clamp_min"
      ],
      "notes": "ADR-0042: W0.RPT=1 selects PER-CHANNEL mode \u2014 W1 becomes a 32B-aligned TCM ptr to 8x Q31 mult words + 8 shift bytes (40B); zp/clamp stay per-tensor in W2/W3. RPT=0 = per-tensor (W1 = Q31 multiplier)."
    },
    {
      "name": "MAT_STORE",
      "value": 5,
      "w1": "dst_addr",
      "w2": "src_tcm_byte",
      "w3": "(dst_row_stride_words<<16)|(rows<<8)|cols (stride 0 = contiguous; ADR-0043 2D scatter)",
      "fields": [
        "dst_addr",
        "src_tcm_byte",
        "rows",
        "cols"
      ],
      "notes": "ADR-0037: W2 = TCM source byte address (0 = legacy weight region at 0x680); matrix flows use the MAT_OUT region (default 0x800)."
    },
    {
      "name": "MAT_ACC_CLR",
      "value": 6,
      "w1": "acc_mask",
